[project]
name = "lfiq-canonical-llm"
version = "0.1.0"
description = "Canonical LLM router for the BRICK app family — OCP→Anthropic→Ollama→rules fallback chain."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.30.0",
  "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["brick_llm"]
